---
volumes:
  speleodb_local_postgres_data: {}
  speleodb_local_postgres_data_backups: {}
  speleodb_local_web_node_modules: {}
  speleodb_local_gitlab_config: {}
  speleodb_local_gitlab_logs: {}
  speleodb_local_gitlab_data: {}
  # speleodb_local_minio_data: {}
  speleodb_local_rustfs_data: {}
  speleodb_local_redis_data: {}

x-django: &django
  build:
    context: .
    dockerfile: ./compose/Dockerfile
    args:
      - DOCKER_BUILDKIT=1
  image: speleodb_local_django
  user: dev-user
  depends_on:
    setup:
      condition: service_completed_successfully
  volumes:
    - .:/app:z
    - type: volume
      source: speleodb_local_web_node_modules
      target: /app/node_modules
      volume:
        nocopy: true
  env_file:
    - ./.envs/.django
    - ./.envs/.postgres
  environment:
    # Compose reads the developer-owned root .env for interpolation. Keep the
    # tracked Django env file free of placeholder values that would shadow it.
    MAPBOX_API_TOKEN: "${MAPBOX_API_TOKEN:-}"
    CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://localhost:6379/1}"
    GITLAB_GROUP_NAME: "${GITLAB_GROUP_NAME:-speleodb}"
  ports: []
  command: sleep infinity
  network_mode: "host"

services:
  django:
    <<: *django
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_django"

  postgres:
    image: postgres:16-alpine
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_postgres"
    volumes:
      - speleodb_local_postgres_data:/var/lib/postgresql/data
      - speleodb_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.postgres
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_redis"
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - speleodb_local_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  django-webserver:
    <<: *django
    image: speleodb_local_django_webserver
    container_name: >-
      ${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_django_webserver
    command: /start

  celery-worker: &celery-worker
    <<: *django
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_celery_worker"
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: /start-celeryworker
    stop_grace_period: 120s
    restart: unless-stopped

  celery-beat:
    <<: *celery-worker
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_celery_beat"
    command: /start-celerybeat

  # A different Redis process isolates Pub/Sub events and remote-control
  # traffic, which Redis logical database numbers alone do not isolate.
  celery-test-redis:
    image: redis:8-alpine
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_test_celery_redis"
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_gitlab_lab"
    privileged: true
    environment:
      # Root User Credentials: root:WE66dZFgKevGzj31My!5
      GITLAB_ROOT_PASSWORD: WE66dZFgKevGzj31My!5
      GITLAB_ROOT_USERNAME: root
      GITLAB_BOOTSTRAP_TOKEN: glpat-speleodb-local-bootstrap-2026
      GITLAB_BOOTSTRAP_TOKEN_NAME: speleodb-local-bootstrap
      GITLAB_GROUP_NAME: "${GITLAB_GROUP_NAME:-speleodb}"
      GITLAB_GROUP_TOKEN_NAME: speleodb-local-development
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:9080'
        # Pages can capture requests to the Compose hostname on this port.
        gitlab_pages['enable'] = false
        pages_nginx['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2222
        prometheus_monitoring['enable'] = false
        alertmanager['enable'] = false
        node_exporter['enable'] = false
        redis_exporter['enable'] = false
        postgres_exporter['enable'] = false
    ports:
      - "9080:9080"
      - "2443:443"
      - "2222:22"
    volumes:
      - speleodb_local_gitlab_config:/etc/gitlab
      - speleodb_local_gitlab_logs:/var/log/gitlab
      - speleodb_local_gitlab_data:/var/opt/gitlab
      - ./compose/gitlab/healthcheck:/opt/speleodb/healthcheck:ro
      - "./compose/gitlab/ensure_bootstrap_token.rb:\
        /opt/speleodb/ensure_bootstrap_token.rb:ro"
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/speleodb/healthcheck"]
      interval: 30s
      timeout: 120s
      retries: 60
      start_period: 15m

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_rustfs"
    environment:
      - RUSTFS_ACCESS_KEY=access_key
      - RUSTFS_SECRET_KEY=secret_key
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - speleodb_local_rustfs_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s

  setup:
    <<: *django
    container_name: "${COMPOSE_INSTANCE_PREFIX:-speleodb}_local_setup"
    user: root
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-test-redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      gitlab:
        condition: service_healthy
    environment:
      GITLAB_GROUP_NAME: "${GITLAB_GROUP_NAME:-speleodb}"
      GITLAB_BOOTSTRAP_TOKEN: glpat-speleodb-local-bootstrap-2026
      GITLAB_GROUP_TOKEN_NAME: speleodb-local-development
      GITLAB_TEST_GROUP_NAME: speleodb-test
      GITLAB_TEST_GROUP_TOKEN_NAME: speleodb-local-test
      LOCAL_AWS_STORAGE_BUCKET_NAME: speleodb-user-artifacts-dev
      LOCAL_AWS_TEST_STORAGE_BUCKET_NAME: speleodb-user-artifacts-test
    command: /app/compose/setup
    restart: "no"
