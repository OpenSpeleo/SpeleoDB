name: Manual GitLab Cleanup

on:
  # schedule:
  #   - cron: "0 10 * * *" # 10 AM UTC corresponds to 5 AM ET during Standard Time
  workflow_dispatch: # Allows manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: speleodb-gitlab-integration-namespace
      cancel-in-progress: false

    services:
      redis:
        image: redis:6
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DJANGO_DEBUG: True
      USE_DOCKER: yes
      # no effect. This job does not access the DB
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      # no effect. This job does not access the DB
      REDIS_URL: "redis://redis:6379/0"
      # Dummy Key - Not Used
      DJANGO_SECRET_KEY: "s&=i@9h+)6bge)6!6vhbcx@=#^6nr73&7+6ep-xpbebhi5#)+_"
      AWS_ACCESS_KEY_ID: "whatever"
      AWS_SECRET_ACCESS_KEY: "whatever"
      AWS_S3_REGION_NAME: "whatever"
      AWS_STORAGE_BUCKET_NAME: "whatever"
      AWS_S3_CUSTOM_DOMAIN: "whatever"
      MAPBOX_API_TOKEN: "whatever"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest-known"
          python-version: "3.14"
          activate-environment: true

      - name: Install Dependencies
        run: uv sync --extra local --frozen

      - name: Clean Gitlab Test Database
        # Preserve repositories owned by active CI jobs (bounded to 60 minutes).
        run: >-
          python manage.py wipe_test_gitlab --settings=config.settings.test
          --accept_danger --skip_user_confirmation --older-than-hours 24
        env:
          GITLAB_GROUP_ID: ${{ vars.GITLAB_GROUP_ID }}
          GITLAB_GROUP_NAME: ${{ vars.GITLAB_GROUP_NAME }}
          GITLAB_HOST_URL: ${{ vars.GITLAB_HOST_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
