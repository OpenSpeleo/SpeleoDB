---
name: Update Browserslist DB

on:
  schedule:
    # Weekly on Monday at 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-browserslist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install JS dependencies
        run: test -s bun.lock && bun install --frozen-lockfile

      - name: Update browserslist database
        run: bunx --bun update-browserslist-db@latest

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-browserslist-db
          base: ${{ github.event.repository.default_branch }}
          delete-branch: true
          title: "chore: update browserslist database"
          commit-message: "chore: update browserslist database"
          add-paths: |
            bun.lock
          body: |
            Automated update for Browserslist's caniuse-lite data.

            ## Why
            Keep browser compatibility data fresh for Tailwind/PostCSS tooling
            and remove stale caniuse-lite warnings.

            ## Changes
            - Updated `bun.lock` via `bunx --bun update-browserslist-db@latest`
