name: CI

# Enable Buildkit and let compose use it to speed up image building
env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

on:
  pull_request:
    branches: ["master", "main", "dev"]
    paths-ignore: ["docs/**"]

  push:
    branches: ["master", "main", "dev", "type-checking"]
    paths-ignore: ["docs/**"]

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: false

jobs:
  linter:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
      # Dummy Key - Not Used
      DJANGO_SECRET_KEY: "s&=i@9h+)6bge)6!6vhbcx@=#^6nr73&7+6ep-xpbebhi5#)+_"
      # Dummy Key - Not Used
      GITLAB_GROUP_ID: "whatever"
      GITLAB_GROUP_NAME: "whatever"
      GITLAB_HOST_URL: "whatever"
      GITLAB_TOKEN: "whatever"
      AWS_ACCESS_KEY_ID: "whatever"
      AWS_SECRET_ACCESS_KEY: "whatever"
      AWS_S3_REGION_NAME: "whatever"
      AWS_STORAGE_BUCKET_NAME: "whatever"
      AWS_S3_CUSTOM_DOMAIN: "whatever"
      MAPBOX_API_TOKEN: "whatever"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          python-version: "3.14"
          activate-environment: true
        env:
          UV_VENV_SEED: 1

      - name: Install Dependencies
        run: uv sync --extra local --frozen

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - run: test -s bun.lock && bun install --frozen-lockfile

      - run: |
          prek run \
            --all-files \
            --show-diff-on-failure \
            --color always
        env:
          DJANGO_DEBUG: True # necessary to collect all URLs

  js-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        run: test -s bun.lock && bun install --frozen-lockfile

      - name: Audit source ownership and executable templates
        run: |
          bun run audit:javascript
          bun run audit:javascript --tracked
          bun run audit:templates
          bun run audit:templates --tracked

      - name: Type-check all three environments, including Railway
        run: bun run typecheck

      - name: Lint frontend TypeScript
        run: bun run lint:frontend

      - name: Verify toolchain compatibility, ambient isolation and frontend
          behavior
        run: bun run test:frontend

      - name: Verify Vite watcher invalidation
        run: bun run test:assets-watch

      - name: Build checked Django-served assets
        run: bun run build

  # With no caching at all the entire ci process takes 3m to complete!
  pytest:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: speleodb-pytest-${{ github.head_ref || github.ref }}
      cancel-in-progress: false

    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379

      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres

      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: access_key
          RUSTFS_SECRET_KEY: secret_key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      # postgres://user:password@host:port/database
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres"
      # Provisioning tests connect directly; service env is not inherited here.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest-known"
          python-version: "3.14"
          activate-environment: true

      - uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          # A specific version to download, may also be "release" or a specific version
          # like "6.1.0". At the moment semver specifiers (i.e. >=6.1.0) are supported
          # only on Windows, on other platforms they are allowed but version is matched
          # exactly regardless.
          ffmpeg-version: release

      - name: Install Dependencies
        run: uv sync --extra local --frozen

      - name: Set up Bun for real browser upload integration
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install browser test dependencies
        run: test -s bun.lock && bun install --frozen-lockfile

      - name: Build checked assets for Django contracts
        run: bun run build

      - name: Run Tests
        run: |
          # Repository writes belong to pytest's audited nine-repository budget.
          python manage.py check_gitlab --read-only --settings config.settings.test
          python manage.py create_s3_local_buckets --settings config.settings.test
          python manage.py validate_templates --settings config.settings.test --ignore-app allauth
          # Keep normal output capture, hang diagnostics, and the slowest tests.
          pytest -o faulthandler_timeout=60 --durations=20
        env: &django-test-environment
          GITLAB_GROUP_ID: ${{ vars.GITLAB_GROUP_ID }}
          GITLAB_GROUP_NAME: ${{ vars.GITLAB_GROUP_NAME }}
          GITLAB_HOST_URL: ${{ vars.GITLAB_HOST_URL }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          MAPBOX_API_TOKEN: ${{ secrets.MAPBOX_API_TOKEN }}
          AWS_ACCESS_KEY_ID: access_key
          AWS_SECRET_ACCESS_KEY: secret_key
          AWS_S3_REGION_NAME: us-east-1
          AWS_STORAGE_BUCKET_NAME: speleodb-user-artifacts-test
          AWS_S3_ENDPOINT_URL: "http://localhost:9000"
          AWS_S3_CUSTOM_DOMAIN: "localhost:9000"
          VIEWER_BROWSER_ARTIFACTS: ${{ runner.temp }}/speleodb-viewer-browser

      - name: Install the unchanged Chromium and WebKit runtimes
        run: bunx --bun playwright install --with-deps chromium webkit

      - name: Run serial browser workloads against the Django live server
        run:
          pytest tests/browser/test_django_browser.py -o faulthandler_timeout=60
          --durations=20
        env: *django-test-environment

      - name: Upload GitLab creation audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitlab-creation-audit
          path: .artifacts/gitlab/
          include-hidden-files: true

      - name: Upload browser report and failure screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-verification
          path: ${{ runner.temp }}/speleodb-viewer-browser/
          if-no-files-found: warn
